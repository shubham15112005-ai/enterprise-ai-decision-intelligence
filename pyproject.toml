[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-decision-intelligence"
version = "1.0.0"
description = "Enterprise AI Decision Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "plotly>=5.24.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0",
    "requests>=2.32.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]