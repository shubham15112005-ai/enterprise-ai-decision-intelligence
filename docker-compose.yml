services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: enterprise-ai-api

    env_file:
      - .env

    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data
      - ./database:/app/database

    command:
      [
        "uvicorn",
        "api_app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    restart: unless-stopped


  streamlit:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: enterprise-ai-streamlit

    env_file:
      - .env

    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000

    ports:
      - "8501:8501"

    volumes:
      - ./data:/app/data
      - ./database:/app/database

    command:
      [
        "streamlit",
        "run",
        "app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]

    restart: unless-stopped